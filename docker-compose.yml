# Development compose file. For production use docker-compose.prod.yml.
# This file mounts the source tree and enables --reload; do not deploy as-is.

services:
  postgres:
    image: postgres:16-alpine
    container_name: prior-auth-db
    environment:
      POSTGRES_USER: prior_auth
      POSTGRES_PASSWORD: prior_auth_dev
      POSTGRES_DB: prior_auth
    ports:
      - "127.0.0.1:5432:5432"   # loopback only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prior_auth -d prior_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prior-auth-redis
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prior-auth-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://prior_auth:prior_auth_dev@postgres:5432/prior_auth
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_BACKEND=memory
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - APP_ENV=development
      - DEBUG=true
      # Dev-only: generate once and paste, or let settings mint ephemerals.
      - PHI_ENCRYPTION_KEYS=${PHI_ENCRYPTION_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: prior-auth-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=http://api:8000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
